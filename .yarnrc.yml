# Plain node_modules: WebContainers (and most tools) expect them.
nodeLinker: node-modules

# Yarn itself is checked in, so `node .yarn/releases/yarn-4.18.1.cjs` works
# anywhere Node does, including a WebContainer that has no Volta or Corepack.
yarnPath: .yarn/releases/yarn-4.18.1.cjs

enableTelemetry: false

# Dependencies' install scripts mostly build native binaries, which a
# WebContainer can't run. Nothing here needs them.
enableScripts: false

# Also install the WebAssembly builds of native packages (Nx, Rolldown,
# Tailwind's Oxide and friends). A WebContainer can't load .node binaries,
# so those packages fall back to the wasm32 build there.
supportedArchitectures:
  cpu:
    - current
    - wasm32
  os:
    - current
  libc:
    - current
